<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 | BCTUNGA</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#060b16">
  <link rel="icon" type="image/png" href="/assets/red-elephant-logo.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(165deg, #060b16, #0a1424 55%, #060b16);
      color: #eaf1fa;
      font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .code {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: clamp(3rem, 12vw, 5.5rem);
      font-weight: 700;
      margin: 0 0 8px;
      background: linear-gradient(92deg, #3fd0f5, #ff3b5c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { color: #9fb2c9; margin: 0 0 26px; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 46px;
      padding: 0 22px;
      border-radius: 10px;
      background: linear-gradient(98deg, #e11744, #d61f44);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <p>Aradığınız sayfa bu hatta yok &mdash; paket hedefe ulaşamadı.</p>
    <a href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
